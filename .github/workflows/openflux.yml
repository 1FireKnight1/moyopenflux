name: OpenFlux Exit Node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openflux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      YANDEX_DOC_URL: ${{ secrets.YANDEX_DOC_URL }}

    steps:
      - name: Check secret
        shell: bash
        run: |
          set +x

          if [ -z "${YANDEX_DOC_URL:-}" ]; then
            echo "ERROR: YANDEX_DOC_URL is not configured."
            exit 1
          fi

          echo "::add-mask::$YANDEX_DOC_URL"
          echo "YANDEX_DOC_URL: configured"

      - name: Install dependencies
        shell: bash
        run: |
          set +x

          sudo apt-get update
          sudo apt-get install -y git golang-go iptables

      - name: Download OpenFlux
        shell: bash
        run: |
          set +x

          git clone --depth 1 https://github.com/p1neappleXpress/OpenFlux.git
          cd OpenFlux

          echo "OpenFlux commit:"
          git rev-parse --short HEAD

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Verify Go
        shell: bash
        run: |
          set +x
          go version

      - name: Build OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          go mod tidy
          go build -o universal-bypass-tool .

          chmod +x universal-bypass-tool

          echo "Build successful."

      - name: Configure iptables
        shell: bash
        run: |
          set +x

          sudo iptables -C OUTPUT \
            -p tcp \
            --tcp-flags RST RST \
            -j DROP 2>/dev/null || \
          sudo iptables -A OUTPUT \
            -p tcp \
            --tcp-flags RST RST \
            -j DROP

          echo "RST DROP rule configured."

      - name: Check raw sockets
        shell: bash
        run: |
          set +x

          sudo python3 - <<'PY'
          import socket

          try:
              s = socket.socket(
                  socket.AF_INET,
                  socket.SOCK_RAW,
                  socket.IPPROTO_TCP
              )
              s.close()
              print("RAW SOCKET: OK")
          except Exception as e:
              print(f"RAW SOCKET: FAILED: {type(e).__name__}: {e}")
          PY

      - name: Start OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          echo "======================================"
          echo "Starting OpenFlux"
          echo "Mode: proxy"
          echo "Transport: yandex"
          echo "URL: configured (hidden)"
          echo "Debug: disabled"
          echo "======================================"

          exec sudo ./universal-bypass-tool \
            --exit-node \
            --transport yandex \
            --url "$YANDEX_DOC_URL"
