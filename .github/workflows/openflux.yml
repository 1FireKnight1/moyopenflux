name: OpenFlux Exit Node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openflux:
    runs-on: ubuntu-24.04

    # GitHub-hosted job максимум около 6 часов.
    timeout-minutes: 350

    env:
      YANDEX_DOC_URL: ${{ secrets.YANDEX_DOC_URL }}

    steps:
      - name: Check Yandex URL secret
        shell: bash
        run: |
          set +x

          if [ -z "${YANDEX_DOC_URL:-}" ]; then
            echo "ERROR: Secret YANDEX_DOC_URL is not configured."
            exit 1
          fi

          # Дополнительная маскировка секрета в GitHub Actions logs.
          echo "::add-mask::$YANDEX_DOC_URL"

          echo "YANDEX_DOC_URL: configured"
          echo "The URL itself will not be printed."

      - name: Checkout OpenFlux source
        shell: bash
        run: |
          set +x

          git clone --depth 1 https://github.com/p1neappleXpress/OpenFlux.git

          cd OpenFlux

          echo "OpenFlux commit:"
          git rev-parse --short HEAD

          echo "Required Go version:"
          awk '$1 == "go" {print $2; exit}' go.mod

      - name: Install base dependencies
        shell: bash
        run: |
          set +x

          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl iptables

      - name: Install required Go version
        shell: bash
        run: |
          set +x

          cd OpenFlux

          REQUIRED_GO="$(awk '$1 == "go" {print $2; exit}' go.mod)"

          if [ -z "$REQUIRED_GO" ]; then
            echo "ERROR: Could not determine Go version from go.mod"
            exit 1
          fi

          echo "::add-mask::$REQUIRED_GO"
          echo "OpenFlux requires Go >= ${REQUIRED_GO}"

          # Go 1.26.4 is currently required by OpenFlux.
          # setup-go gets the exact version from go.mod.
          echo "REQUIRED_GO=$REQUIRED_GO" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.REQUIRED_GO }}
          cache: false

      - name: Verify Go
        shell: bash
        run: |
          set +x
          echo "Installed Go:"
          go version

      - name: Check runner network
        shell: bash
        run: |
          set +x

          echo "Checking outbound IPv4..."
          IPV4="$(curl -4 -fsS --max-time 10 https://api.ipify.org || true)"

          if [ -n "$IPV4" ]; then
            echo "IPv4 egress: $IPV4"
          else
            echo "IPv4 egress check failed"
          fi

          echo "Checking HTTPS connectivity..."
          HTTP_CODE="$(curl -4 -fsS \
            --max-time 10 \
            -o /dev/null \
            -w '%{http_code}' \
            https://example.com || true)"

          echo "HTTPS test: ${HTTP_CODE:-failed}"

      - name: Build OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          echo "Downloading Go modules..."
          go mod download

          echo "Building OpenFlux..."
          go build -o universal-bypass-tool .

          chmod +x universal-bypass-tool

          echo "Build successful."

      - name: Configure iptables
        shell: bash
        run: |
          set +x

          # Proxy mode does not require iptables.
          # We keep the rule because the current OpenFlux supports raw mode
          # and this makes the runner ready for the network test.
          if sudo iptables -C OUTPUT \
              -p tcp \
              --tcp-flags RST RST \
              -j DROP 2>/dev/null; then

            echo "RST DROP rule already exists."

          else

            sudo iptables -A OUTPUT \
              -p tcp \
              --tcp-flags RST RST \
              -j DROP

            echo "RST DROP rule added."

          fi

      - name: Check raw socket capability
        shell: bash
        run: |
          set +x

          sudo python3 - <<'PY'
          import socket

          try:
              s = socket.socket(
                  socket.AF_INET,
                  socket.SOCK_RAW,
                  socket.IPPROTO_TCP
              )
              s.close()
              print("RAW SOCKET: OK")
          except Exception as e:
              print("RAW SOCKET: FAILED")
              print(f"{type(e).__name__}: {e}")
          PY

      - name: Start OpenFlux exit node
        shell: bash
        run: |
          set +x

          cd OpenFlux

          echo "======================================"
          echo "Starting OpenFlux"
          echo "Mode: proxy"
          echo "Transport: yandex"
          echo "URL: configured (hidden)"
          echo "Debug: disabled"
          echo "======================================"

          exec sudo ./universal-bypass-tool \
            --exit-node \
            --transport yandex \
            --url "$YANDEX_DOC_URL"
