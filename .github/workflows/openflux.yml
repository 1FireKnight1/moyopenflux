name: OpenFlux Exit Node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openflux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      YANDEX_DOC_URL: ${{ secrets.YANDEX_DOC_URL }}

      # Меньше накладных расходов на GC.
      GOGC: "100"

      # Не даём Go пытаться использовать слишком много CPU.
      GOMAXPROCS: "2"

    steps:
      - name: Checkout OpenFlux
        shell: bash
        run: |
          set +x

          git clone --depth 1 --single-branch \
            https://github.com/p1neappleXpress/OpenFlux.git

          cd OpenFlux

          echo "OpenFlux commit:"
          git rev-parse --short HEAD

          echo "Go requirement:"
          awk '$1 == "go" {print $2; exit}' go.mod

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: OpenFlux/go.mod
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          set +x

          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables

      - name: Verify environment
        shell: bash
        run: |
          set +x

          cd OpenFlux

          echo "Go:"
          go version

          echo "CPU:"
          nproc

          echo "Memory:"
          free -h

          echo "IPv4 egress:"
          curl -4 -fsS --max-time 10 https://api.ipify.org || true
          echo

      - name: Build OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          # Только скачиваем зависимости.
          # go mod tidy здесь не нужен для запуска.
          go mod download

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o universal-bypass-tool .

          chmod +x universal-bypass-tool

          echo "Build successful."

      - name: Configure networking
        shell: bash
        run: |
          set +x

          # Текущая официальная инструкция OpenFlux
          # использует этот RST DROP для exit node.
          sudo iptables -C OUTPUT \
            -p tcp \
            --tcp-flags RST RST \
            -j DROP 2>/dev/null || \
          sudo iptables -A OUTPUT \
            -p tcp \
            --tcp-flags RST RST \
            -j DROP

          echo "iptables configured."

      - name: Check raw socket
        shell: bash
        run: |
          set +x

          sudo python3 - <<'PY'
          import socket

          try:
              s = socket.socket(
                  socket.AF_INET,
                  socket.SOCK_RAW,
                  socket.IPPROTO_TCP
              )
              s.close()
              print("RAW SOCKET: OK")
          except Exception as e:
              print(f"RAW SOCKET: FAILED: {e}")
          PY

      - name: Start OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          if [ -z "${YANDEX_DOC_URL:-}" ]; then
            echo "ERROR: YANDEX_DOC_URL is missing."
            exit 1
          fi

          echo "::add-mask::$YANDEX_DOC_URL"

          echo "======================================"
          echo "OpenFlux Exit Node"
          echo "Transport: yandex"
          echo "Mode: proxy"
          echo "URL: hidden"
          echo "Debug: disabled"
          echo "======================================"

          exec sudo ./universal-bypass-tool \
            --exit-node \
            --transport yandex \
            --url "$YANDEX_DOC_URL"
